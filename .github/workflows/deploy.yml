name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  commitlint:
    permissions:
      contents: read
    uses: ./.github/workflows/commitlint.yml

  deploy:
    needs: commitlint
    environment:
      name: github-pages
      url: ${{ steps.deployment_final.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate blog data
        run: npm run blog:generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_GITHUB_REPO: ${{ github.repository }}
          BLOG_GITHUB_LABEL: blog

      - name: Build site
        run: npm run build
        env:
          VITE_BLOG_DATA_SOURCE: static
          VITE_BLOG_STATIC_URL: /blog/index.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Retry deployment only; re-uploading can create duplicate named artifacts.
      - name: Deploy to GitHub Pages (attempt 1/3)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before second deployment attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: Deploy to GitHub Pages (attempt 2/3)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final deployment attempt
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 3/3)
        id: deployment_final
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
