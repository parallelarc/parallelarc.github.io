name: Commit messages

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit message format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # New branches have an all-zero "before"; compare with the default branch.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            if git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
              BASE_SHA="$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH")"
            fi
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ || "$BASE_SHA" == "$HEAD_SHA" ]]; then
              if git rev-parse --verify "$HEAD_SHA^" >/dev/null 2>&1; then
                npm run lint:commits -- --from "$HEAD_SHA^" --to "$HEAD_SHA" --verbose
              else
                npm run lint:commits -- --to "$HEAD_SHA" --verbose
              fi
              exit 0
            fi
          fi

          # A force push may leave the previous head outside the fetched history.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          npm run lint:commits -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
